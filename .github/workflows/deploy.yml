name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate nội dung
        run: npm run content:check
      - name: Test content pipeline
        run: npm run test:scripts
      - name: Unit test
        run: npm test -- --watch=false
      - name: Build
        run: npm run build -- --base-href /${{ github.event.repository.name }}/
      - name: SPA fallback cho GitHub Pages
        run: cp dist/learning-hub/browser/index.html dist/learning-hub/browser/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/learning-hub/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
